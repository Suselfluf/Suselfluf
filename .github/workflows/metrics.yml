name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Summary stats (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Suselfluf
          filename: metrics/summary.dark.svg
          base: header, repositories
          config_timezone: Europe/Moscow
          extras_css: |
            svg { color: #adbac7 }
            h1, h2 { color: #539bf5 }
            .field svg { fill: #768390 }
            .calendar .day { outline-color: rgba(240,246,252,0.10) }
            [fill="#ebedf0"] { fill: #161b22 }
            [fill="#9be9a8"] { fill: #0e4429 }
            [fill="#40c463"] { fill: #006d32 }
            [fill="#30a14e"] { fill: #26a641 }
            [fill="#216e39"] { fill: #39d353 }
            :root {
              --color-calendar-graph-day-bg: #161b22;
              --color-calendar-graph-day-border: rgba(240,246,252,0.10);
              --color-calendar-graph-day-L1-bg: #0e4429;
              --color-calendar-graph-day-L2-bg: #006d32;
              --color-calendar-graph-day-L3-bg: #26a641;
              --color-calendar-graph-day-L4-bg: #39d353;
              --color-calendar-graph-day-L1-border: rgba(240,246,252,0.10);
              --color-calendar-graph-day-L2-border: rgba(240,246,252,0.10);
              --color-calendar-graph-day-L3-border: rgba(240,246,252,0.10);
              --color-calendar-graph-day-L4-border: rgba(240,246,252,0.10);
            }
          repositories_affiliations: owner, collaborator

      - name: Summary stats (light)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Suselfluf
          filename: metrics/summary.light.svg
          base: header, repositories
          config_timezone: Europe/Moscow
          repositories_affiliations: owner, collaborator

      - name: Commit calendar (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Suselfluf
          filename: metrics/calendar.dark.svg
          base: ""
          config_timezone: Europe/Moscow
          extras_css: |
            svg { color: #adbac7 }
            h1, h2 { color: #539bf5 }
            .field svg { fill: #768390 }
            .calendar .day { outline-color: rgba(240,246,252,0.10) }
            [fill="#ebedf0"] { fill: #161b22 }
            [fill="#9be9a8"] { fill: #0e4429 }
            [fill="#40c463"] { fill: #006d32 }
            [fill="#30a14e"] { fill: #26a641 }
            [fill="#216e39"] { fill: #39d353 }
            :root {
              --color-calendar-graph-day-bg: #161b22;
              --color-calendar-graph-day-border: rgba(240,246,252,0.10);
              --color-calendar-graph-day-L1-bg: #0e4429;
              --color-calendar-graph-day-L2-bg: #006d32;
              --color-calendar-graph-day-L3-bg: #26a641;
              --color-calendar-graph-day-L4-bg: #39d353;
              --color-calendar-graph-day-L1-border: rgba(240,246,252,0.10);
              --color-calendar-graph-day-L2-border: rgba(240,246,252,0.10);
              --color-calendar-graph-day-L3-border: rgba(240,246,252,0.10);
              --color-calendar-graph-day-L4-border: rgba(240,246,252,0.10);
            }
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Commit calendar (light)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Suselfluf
          filename: metrics/calendar.light.svg
          base: ""
          config_timezone: Europe/Moscow
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
