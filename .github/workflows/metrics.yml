name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Contributions calendar (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Suselfluf
          config_timezone: Europe/Moscow
          base: header
          plugin_calendar: yes
          plugin_calendar_limit: 2
          filename: metrics/calendar.dark.svg
          extras_css: |
            svg { color: #adbac7 }
            h1, h2, h3 { color: #539bf5 }
            .field svg { fill: #768390 }
            .calendar .day { outline-color: rgba(240,246,252,0.10) }
            [fill="#ebedf0"] { fill: #161b22 }
            [fill="#9be9a8"] { fill: #0e4429 }
            [fill="#40c463"] { fill: #006d32 }
            [fill="#30a14e"] { fill: #26a641 }
            [fill="#216e39"] { fill: #39d353 }

      - name: Contributions calendar (light)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Suselfluf
          config_timezone: Europe/Moscow
          base: header
          plugin_calendar: yes
          plugin_calendar_limit: 2
          filename: metrics/calendar.light.svg
